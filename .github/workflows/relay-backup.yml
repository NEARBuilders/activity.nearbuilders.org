name: Relay backup

# Exports relay.nearbuilders.org daily, proves the export restores into an empty strfry, and keeps
# the file as a build artifact. See infra/relay/README.md#backups-and-restore.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export and restore-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Export the relay
        run: |
          bun infra/relay/export-relay.mjs wss://relay.nearbuilders.org --cap=1000 > relay-backup.jsonl
          count=$(wc -l < relay-backup.jsonl)
          echo "exported $count events"
          if [ "$count" -lt 1 ]; then
            echo "The relay returned no events; refusing to store an empty backup." >&2
            exit 1
          fi

      # A backup nobody has restored is not a backup. This proves the file loads into a fresh
      # relay built from this repository, with the same event IDs.
      - name: Restore into an empty relay
        run: |
          docker build -q -t nearbuilders-relay infra/relay
          docker run -d --name relay-restore -p 127.0.0.1:7777:7777 \
            -e RELAY_WRITE_RATE=1000 -e RELAY_WRITE_BURST=10000 nearbuilders-relay
          for _ in $(seq 1 30); do
            curl -sf -m 2 -H 'Accept: application/nostr+json' http://127.0.0.1:7777 >/dev/null && break
            sleep 2
          done
          bun infra/relay/publish-events.mjs ws://127.0.0.1:7777 --rate=200 < relay-backup.jsonl
          bun infra/relay/export-relay.mjs ws://127.0.0.1:7777 --cap=1000 > relay-restored.jsonl
          docker rm -f relay-restore >/dev/null
          python3 - <<'PY'
          import json, sys
          source = {json.loads(line)["id"] for line in open("relay-backup.jsonl")}
          restored = {json.loads(line)["id"] for line in open("relay-restored.jsonl")}
          missing = source - restored
          print(f"backup {len(source)} events, restored {len(restored)}, missing {len(missing)}")
          if missing:
              print("Restore lost events:", sorted(missing)[:5], file=sys.stderr)
              sys.exit(1)
          PY

      - name: Keep the backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-backup-${{ github.run_id }}
          path: relay-backup.jsonl
          retention-days: 90

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert
        with:
          text: "Relay backup failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          webhook-url: ${{ secrets.ALERT_WEBHOOK_URL }}
