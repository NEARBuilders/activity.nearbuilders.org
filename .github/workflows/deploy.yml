name: Deploy

# Thin wrapper — the shared implementation lives in the base runtime repo
# (NEARBuilders/everything-dev). This repo owns triggers, secret policy, and
# working directory. The @main ref is the reusable-wrapper pointer only: the
# child's framework surface is pinned via `platform` (ADR 0034) and moves
# exclusively through `bos upgrade`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false
      storage_origin:
        description: 'Upload service origin (default: vars.BOS_STORAGE_ORIGIN or the shared service)'
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  # Fail closed (#118, nearbuilders.org#380, security audit #341): without
  # AUTH_DATABASE_URL the host falls back to a local database and scatters
  # auth tables into the wrong storage. Production deploys must not run
  # until the secret is set. The boot-time guard belongs upstream — tracked
  # on NEARBuilders/everything-dev; this job is the child-side stopgap.
  auth-database-guard:
    name: Require AUTH_DATABASE_URL
    runs-on: ubuntu-latest
    steps:
      - name: Check the prod auth DB is configured
        env:
          HAS_AUTH_DB: ${{ secrets.AUTH_DATABASE_URL != '' }}
        run: |
          if [ "$HAS_AUTH_DB" != "true" ]; then
            echo "::error::AUTH_DATABASE_URL is not set as a repo secret. Prod must not boot with the framework's local-DB fallback (nb#380). Set the secret, then re-run the deploy."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [auth-database-guard]
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-deploy.yml@v2.0.0-rc.39
    with:
      working_directory: .
      verbose: ${{ inputs.verbose == true }}
      storage_origin: ${{ inputs.storage_origin || vars.BOS_STORAGE_ORIGIN || 'https://upload.everything.dev' }}
    secrets: inherit
