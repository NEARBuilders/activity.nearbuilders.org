name: Child CI Jobs

# CHILD-OWNED — bos upgrade never rewrites this file (#538). This repo's extra
# CI jobs live here. `ci.yml` (framework-owned) calls this workflow in parallel
# with the pinned reusable `ci` call and includes its result in the merge gate.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  activity:
    name: Activity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Get pnpm store dir
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (Node 24)
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run postinstall
        run: pnpm run postinstall

      - name: Test relay write policy
        run: node --test infra/relay/write-policy.test.mjs infra/relay/write-policy.integration.test.mjs

      - name: Test repository scripts
        run: pnpm run test:scripts

      # ui/public/docs/ is generated from docs/. Fail if someone edited a published document
      # without re-running the sync, so the website never serves stale guidance.
      - name: Check published docs are current
        run: |
          pnpm run docs:sync
          git diff --exit-code -- ui/public/docs \
            || { echo "ui/public/docs is stale; run 'pnpm run docs:sync' and commit the result." >&2; exit 1; }

      - name: Check compose port bindings
        run: pnpm run compose:doctor

      - name: Run clean-room integration guide smoke test
        run: pnpm run test:integration-guide

      - name: Start Activity infrastructure
        run: pnpm run dev:activity-infra

      - name: Run Activity integration test
        env:
          ACTIVITY_INTEGRATION: "1"
        run: pnpm --dir api test tests/integration/activity-boundary.test.ts

      - name: Stop Activity infrastructure
        if: always()
        run: pnpm run dev:activity-infra:down
