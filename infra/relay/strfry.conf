##
## strfry config for relay.nearbuilders.org
##
## Requirements come from docs/activity-protocol.md#production-requirements. Values that differ per
## deployment (public URL, NIP-11 contact, port) are passed by entrypoint.sh with --set, so this
## file stays static. Unlisted settings keep strfry's defaults.
##

# LMDB database on the persistent volume (restart required)
db = "/data/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    # Activity payloads are capped at 16 KiB before signing; this leaves room for tags and signature.
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    # Railway's proxy sets the client address here (a single value, unlike x-forwarded-for).
    # The write policy rate-limits per address. Overridable with RELAY_REAL_IP_HEADER.
    realIpHeader = "x-real-ip"

    auth {
        enabled = true
        serviceUrl = "wss://relay.nearbuilders.org"
        restrictedReadKinds = "4, 1059"
        restrictReadToInvolvedPubkey = true
    }

    info {
        name = "NEAR Builders Relay"
        description = "Nostr relay for NEAR Builders apps: Activity events (kind 1701) and nostr.nearbuilders.org comments and profiles."
        pubkey = ""
        self = ""
        contact = "https://github.com/NEARBuilders/activity.nearbuilders.org"
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000

    # Activity scans up to 1,000 matching events per page and filters on up to four indexed tags
    # (#s source, #t type, #n actor, #i idempotency key). Activity's adapters declare a cap no higher
    # than this value; declaring more than the relay returns would hide truncation.
    maxFilterLimit = 1000
    maxTagsPerFilter = 4
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 67108864

    writePolicy {
        plugin = "/app/write-policy.mjs"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
