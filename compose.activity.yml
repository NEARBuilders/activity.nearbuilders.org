# This file is the Activity service's only commit-worthy infra source.
# docker-compose.yml (also in this directory) is bos-template-owned: it is
# gitignored and regenerated from upstream everything-dev on every
# `bos sync`/`bos upgrade`, so it cannot be hand-edited to avoid a port
# collision with this file. Run `bun run compose:doctor` (scripts/compose-doctor.ts)
# after any sync to catch one before `bun run dev` starts. See issue #29.
services:
  activity-relay:
    image: ghcr.io/mattn/nostr-relay:v0.0.250
    platform: linux/amd64
    environment:
      DATABASE_URL: /data/nostr-relay.sqlite
    ports:
      - "7447:7447"
    volumes:
      - activity-relay-data:/data

  activity-redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - activity-redis-data:/data

volumes:
  activity-relay-data:
  activity-redis-data:
